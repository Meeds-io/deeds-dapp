meeds.elasticsearch.listener.clientName=dApp
meeds.elasticsearch.listener.events.cleanupHoursPeriodicity=12
meeds.elasticsearch.autoCreateIndex=true
spring.task.scheduling.pool.size=5
spring.mvc.servlet.path=/

# Jackson 3 (Spring Boot 4) changed defaults that Spring Boot does not reset; keep the Jackson 2 REST
# wire contract this standalone application exposed so far (same policy as the platform's
# application-common.properties): null on primitive DTO fields stays 0/false instead of a 400, and
# enums keep serializing/parsing with name() instead of toString()
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.datatype.enum.write-enums-using-to-string=false
spring.jackson.datatype.enum.read-enums-using-to-string=false
